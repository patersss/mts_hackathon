- name: Reset Kubernetes node
  hosts: k8s
  tasks:
    - name: Kubeadm reset
      ansible.builtin.command: kubeadm reset -f
      args:
        removes: /etc/kubernetes/kubelet.conf
      changed_when: true

    - name: Remove cluster state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/etcd
        - /etc/kubernetes
        - "{{ kubeconfig }}"

    # kubeadm reset не чистит правила kube-proxy
    - name: Flush iptables rules left by kube-proxy
      ansible.builtin.shell: |
        set -o pipefail
        iptables-save | grep -v KUBE- | iptables-restore
      args:
        executable: /bin/bash
      changed_when: true
