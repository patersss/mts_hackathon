- name: Kubernetes apt key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"

- name: Kubernetes apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /"
    filename: kubernetes

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_version }}-*"
      - "kubeadm={{ k8s_version }}-*"
      - "kubectl={{ k8s_version }}-*"
    allow_downgrade: true
    allow_change_held_packages: true

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true

- name: Kubeadm config
  ansible.builtin.template:
    src: kubeadm.yaml.j2
    dest: /etc/kubernetes/kubeadm.yaml
    mode: "0600"

- name: Find foreign CNI configs
  ansible.builtin.find:
    paths: /etc/cni/net.d
    excludes: ["*calico*"]
  register: kubernetes_cni_confs

# Посторонний bridge CNI (например от podman) перехватывает поды до установки Calico
- name: Remove foreign CNI configs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ kubernetes_cni_confs.files }}"

- name: Init cluster
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm.yaml
  args:
    creates: /etc/kubernetes/admin.conf

# на уже поднятом кластере init пропускается, манифест apiserver обновляем отдельно
- name: Kube-apiserver manifest
  ansible.builtin.shell: |
    set -o pipefail
    before=$(sha256sum /etc/kubernetes/manifests/kube-apiserver.yaml)
    kubeadm init phase control-plane apiserver --config /etc/kubernetes/kubeadm.yaml >/dev/null
    [ "$before" = "$(sha256sum /etc/kubernetes/manifests/kube-apiserver.yaml)" ] || echo changed
  args:
    executable: /bin/bash
  register: kubernetes_apiserver
  changed_when: kubernetes_apiserver.stdout == 'changed'

# kubelet замечает новый манифест не сразу
- name: Let kubelet restart apiserver
  ansible.builtin.pause:
    seconds: 40
  when: kubernetes_apiserver.stdout == 'changed'

- name: Wait for apiserver
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz
  register: kubernetes_readyz
  retries: 24
  delay: 5
  until: kubernetes_readyz.rc == 0
  changed_when: false
  when: kubernetes_apiserver.stdout == 'changed'

- name: Kubeconfig dir for {{ deploy_user }}
  ansible.builtin.file:
    path: "{{ kubeconfig | dirname }}"
    state: directory
    owner: "{{ deploy_user }}"
    mode: "0700"

- name: Kubeconfig for {{ deploy_user }}
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig }}"
    remote_src: true
    owner: "{{ deploy_user }}"
    mode: "0600"

- name: Install helm
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz | tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
  args:
    executable: /bin/bash
    creates: /usr/local/bin/helm
