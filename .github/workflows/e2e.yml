name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubeadm:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      # на раннере свободно меньше 10% диска, kubelet уходит в DiskPressure и вытесняет поды
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift /usr/lib/jvm \
            /opt/microsoft /opt/google /usr/local/share/chromium /usr/local/julia* /opt/az
          sudo docker system prune -af --volumes
          df -h /
      - name: Deploy
        timeout-minutes: 30
        run: make deploy
      - name: Verify
        run: make verify
      - name: Redeploy (idempotency)
        timeout-minutes: 20
        run: make deploy
      - name: Verify again
        run: make verify
      - name: Dump cluster state
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get tigerastatus -o yaml || true
          kubectl -n calico-system describe pods || true
          kubectl -n calico-system logs --all-containers --tail=100 -l k8s-app=calico-node || true
          kubectl -n tigera-operator logs --tail=100 deploy/tigera-operator || true
          kubectl get gatewayclass,gateway,httproute -A -o yaml || true
          kubectl -n envoy-gateway-system get pods,svc -o wide || true
          kubectl -n envoy-gateway-system logs --tail=100 deploy/envoy-gateway || true
          kubectl -n metallb-system logs --tail=50 -l app.kubernetes.io/component=controller || true
          kubectl -n demo describe pods || true
          kubectl -n monitoring get pods,pvc,svc -o wide || true
          kubectl -n monitoring describe pods || true
          kubectl get podmonitor,servicemonitor,httproute,securitypolicy -A || true
          kubectl -n monitoring logs --tail=50 -l app.kubernetes.io/name=prometheus-operator || true
          kubectl -n demo logs --tail=50 -l app=hello || true
          kubectl -n logging get pods,pvc,svc -o wide || true
          kubectl -n logging describe pods || true
          kubectl -n logging logs --tail=100 -l app=fluentd || true
          kubectl -n logging logs --tail=100 statefulset/loki || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          sudo journalctl -u kubelet --no-pager | tail -60 || true
